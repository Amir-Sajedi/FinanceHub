{% extends "base.html" %}
{% load static %}

{% block title %}صفحه پیدا نشد | فاینانس‌هاب{% endblock %}

{% block content %}
    <div class="not-found-container">
        <div class="auth-card">
            <div class="not-found-icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 8V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="16" r="1" fill="currentColor"/>
                </svg>
            </div>
            <h1 class="num">۴۰۴</h1>
            <h2>صفحه پیدا نشد</h2>
            <p class="not-found-message">اوه! صفحه‌ای که دنبالش هستید وجود ندارد؛ شاید جابه‌جا یا حذف شده باشد.</p>
            <div class="not-found-actions">
                <a href="{% url 'home' %}" class="home-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    بازگشت به خانه
                </a>
            </div>
        </div>
    </div>
{% endblock %}

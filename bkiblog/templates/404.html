{% block content %}
<div class="container result-page">
    <div class="result-card">
        <p class="result-code num" aria-hidden="true">۴۰۴</p>
        <span class="result-icon result-icon--error" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
        </span>

        <div class="result-actions">

            <a href="{% url 'login' %}" class="btn btn--secondary">ورود به حساب</a>

    </div>

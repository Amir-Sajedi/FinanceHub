{% extends "base.html" %}
{% load static %}

{% block styling %}
    <link rel="stylesheet" href="{% static 'blog/404.css' %}">
{% endblock %}

{% block content %}
    <div class="not-found-container">
        <div class="not-found-card">
            <div class="not-found-icon">
                <svg width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="#14b8a6" stroke-width="2"/>
                    <path d="M12 8V12" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="16" r="1" fill="#14b8a6"/>
                </svg>
            </div>
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p class="not-found-message">Oops! The page you're looking for doesn't exist. It may have been moved or deleted.</p>
            <div class="not-found-actions">
                <a href="{% url 'home' %}" class="home-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Back to Home
                </a>
            </div>
        </div>
    </div>
{% endblock %}

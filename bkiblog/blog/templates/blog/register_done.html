{% extends "base.html" %}
{% load static %}

{% block content %}
    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                <div class="logo-icon success-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2"/>
                        <path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <h1>Registration Complete!</h1>
                <p>Your account has been created successfully</p>
            </div>

            <p class="success-message">Welcome to Finance Hub! You can now sign in with your credentials.</p>

            <div class="success-actions">
                <a href="{% url 'login' %}" class="btn-submit">Go to Login</a>
                <a href="{% url 'home' %}" class="btn-cancel">Back to Home</a>
            </div>
        </div>
    </div>
{% endblock %}

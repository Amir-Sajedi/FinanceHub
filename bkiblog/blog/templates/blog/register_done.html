
{% load static %}

{% block styling %}
    <link rel="stylesheet" href="{% static 'blog/login.css' %}">
{% endblock %}

{% block content %}
    <div class="login-container">
        <div class="login-card">
            <div class="card-header">
                <div class="logo-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2"/>
                        <path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <h1>Registration Complete!</h1>
                <p>Your account has been created successfully</p>
            </div>

            <div class="success-message" style="text-align: center; padding: 1.5rem 0; color: var(--text-secondary); font-size: 0.95rem;">
                <p style="margin-bottom: 0.5rem;">Welcome to Keshavarzi Finance Hub!</p>
                <p>You can now sign in with your credentials.</p>
            </div>

            <div class="form-extras" style="flex-direction: column; gap: 0.75rem;">
                <a href="{% url 'login' %}" class="btn-submit" style="text-align: center; text-decoration: none; display: block;">
                    Go to Login
                </a>
                <a href="{% url 'home' %}" class="link-text" style="text-align: center; display: block; margin-top: 0.5rem;">
                    Back to Home
                </a>
            </div>
        </div>
    </div>
{% endblock %}

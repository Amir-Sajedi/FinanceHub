{% extends "base.html" %}
{% load static %}

{% block title %}ثبت‌نام کامل شد | فاینانس‌هاب{% endblock %}

{% block content %}
    <div class="login-container">
        <div class="auth-card">
            <div class="card-header">
                <div class="logo-icon success-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2"/>
                        <path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <h1>ثبت‌نام کامل شد!</h1>
                <p>حساب شما با موفقیت ساخته شد</p>
            </div>

            <p class="success-message">به فاینانس‌هاب خوش آمدید! حالا می‌توانید با اطلاعات خود وارد شوید.</p>

            <div class="success-actions">
                <a href="{% url 'login' %}" class="btn-submit">رفتن به ورود</a>
                <a href="{% url 'home' %}" class="btn-cancel">بازگشت به خانه</a>
            </div>
        </div>
    </div>
{% endblock %}

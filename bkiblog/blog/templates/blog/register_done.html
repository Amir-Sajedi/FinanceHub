{% extends "base.html" %}
{% load static %}

{% block title %}ثبت‌نام کامل شد | فاینانس‌هاب{% endblock %}

{% block content %}
<div class="container result-page">
    <div class="result-card">
        <span class="result-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <h1>حساب شما ساخته شد</h1>
        <p>به فاینانس‌هاب خوش آمدید. حالا می‌توانید وارد شوید و اولین تبدیل را انجام دهید.</p>

        <div class="result-actions">
            <a href="{% url 'login' %}" class="btn btn--primary">رفتن به ورود</a>
            <a href="{% url 'home' %}" class="btn btn--secondary">بازگشت به خانه</a>
        </div>
    </div>
</div>
{% endblock %}

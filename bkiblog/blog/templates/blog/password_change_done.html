
{% load static %}

{% block styling %}
    <link rel="stylesheet" href="{% static 'blog/password_change.css' %}">
{% endblock %}

{% block content %}
    <div class="password-change-container">
        <div class="password-change-card success-card">
            <div class="card-header">
                <div class="logo-icon success-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2"/>
                        <path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <h1>Password Changed!</h1>
                <p>Your password has been updated successfully</p>
            </div>

            <div class="success-actions">
                <a href="{% url 'settings' %}" class="btn-submit">
                    Go to Settings
                </a>
                <a href="{% url 'home' %}" class="btn-cancel">
                    Back to Home
                </a>
            </div>
        </div>
    </div>
{% endblock %}

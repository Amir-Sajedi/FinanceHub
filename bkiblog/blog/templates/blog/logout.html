{% extends "base.html" %}
{% load static %}

{% block styling %}
    <link rel="stylesheet" href="{% static 'blog/logout.css' %}">
{% endblock %}

{% block content %}
    <div class="logout-container">
        <div class="logout-card">
            <div class="logout-icon">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="var(--primary-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 17L21 12L16 7" stroke="var(--primary-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 12H9" stroke="var(--primary-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>You've Been Logged Out</h1>
            <p class="logout-message">Thank you for using Finance Hub. Your session has ended securely.</p>
            <div class="logout-actions">
                <a href="{% url 'home' %}" class="back-btn">Back to Site</a>
                <a href="{% url 'login' %}" class="login-again-btn">Login Again</a>
            </div>
        </div>
    </div>
{% endblock %}
